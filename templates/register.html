<!DOCTYPE html>
<html lang="zh" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 - JellyWall</title>
    <style>
        /* ==========================================
           1. 全局 CSS 变量定义
           ========================================== */
        :root {
            --bg-color: #121212;
            --sidebar-bg: #1e1e1e;
            --text-main: #ffffff;
            --text-muted: #aaaaaa;
            --border-color: #333333;
            --primary-color: #00a4dc;

            --click-x: 50%;
            --click-y: 50%;
            --ripple-speed: 1.1s;
        }

        [data-theme="light"] {
            --bg-color: #f3f4f6;
            --sidebar-bg: #ffffff;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --border-color: #e5e7eb;
        }

        /* ==========================================
           2. View Transitions API 涟漪动画
           ========================================== */
        ::view-transition-group(root) { animation: none; }
        ::view-transition-old(root) { animation: none; z-index: 1; }
        ::view-transition-new(root) { z-index: 9999; animation: ripple-spread var(--ripple-speed) cubic-bezier(0.25, 1, 0.3, 1) both; }
        @keyframes ripple-spread {
            0% { clip-path: circle(0px at var(--click-x) var(--click-y)); }
            100% { clip-path: circle(150% at var(--click-x) var(--click-y)); }
        }

        /* ==========================================
           3. 登录页专属居中布局
           ========================================== */
        body {
            margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex; justify-content: center; align-items: center; min-height: 100vh;
            background-color: var(--bg-color); color: var(--text-main);
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            transition: background-color 0.3s, color 0.3s;
            position: relative;
        }
        /* 背景氛围光晕：精简为左下角一团，避免与照片背景冲突 */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            pointer-events: none;
            background: radial-gradient(520px circle at 8% 92%,
                    color-mix(in srgb, var(--primary-color) 9%, transparent), transparent 65%);
            z-index: 1;
        }
        /* 电影遮幅式遮罩 */
        body::after {
            content: '';
            position: fixed;
            inset: 0;
            pointer-events: none;
            background: linear-gradient(180deg, rgba(0, 0, 0, 0.45), rgba(0, 0, 0, 0.30) 35%, rgba(0, 0, 0, 0.68));
            z-index: 0;
        }

        .top-navbar {
            position: absolute; top: 20px; right: 20px;
            display: flex; align-items: center; gap: 20px;
            z-index: 100;
        }
        .theme-switch { background: var(--sidebar-bg); border: 1px solid var(--border-color); color: var(--text-main); padding: 8px 15px; border-radius: 20px; cursor: pointer; font-size: 14px; transition: 0.2s; box-shadow: 0 4px 6px rgba(0,0,0,0.05);}
        .theme-switch:hover { border-color: var(--primary-color); }
        .color-picker-container { display: flex; gap: 10px; align-items: center; background: var(--sidebar-bg); padding: 8px 15px; border-radius: 20px; border: 1px solid var(--border-color); box-shadow: 0 4px 6px rgba(0,0,0,0.05);}
        .color-dot { width: 18px; height: 18px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; transition: transform 0.2s; }
        .color-dot:hover { transform: scale(1.2); }

        .login-card {
            background: rgba(255, 255, 255, 0.08);
            -webkit-backdrop-filter: blur(24px) saturate(160%);
            backdrop-filter: blur(24px) saturate(160%);
            padding: 44px 40px 38px;
            border-radius: 20px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.16);
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            z-index: 2;
            animation: login-card-in 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) both;
        }
        [data-theme="light"] .login-card {
            background: rgba(255, 255, 255, 0.65);
            border: 1px solid rgba(255, 255, 255, 0.75);
        }
        @keyframes login-card-in {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes login-fade {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .login-logo-wrap {
            animation: login-float 5s ease-in-out infinite, login-fade 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) 0.15s both;
        }
        .login-title {
            animation: login-fade 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) 0.2s both;
        }
        .login-subtitle {
            animation: login-fade 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) 0.25s both;
        }
        .login-form {
            animation: login-fade 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) 0.3s both;
        }
        .login-footer {
            animation: login-fade 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) 0.35s both;
            color: var(--text-muted);
            font-size: 12px;
            margin-top: 22px;
        }

        /* Logo 渐变容器 + 浮动动画 + 地面影子 */
        .login-logo-wrap {
            width: 88px;
            height: 88px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 18px;
            position: relative;
            animation: login-float 5s ease-in-out infinite;
        }
        .login-logo-wrap img {
            width: 72px;
            height: 72px;
            object-fit: contain;
        }
        .login-logo-wrap::after {
            content: '';
            position: absolute;
            left: 50%;
            bottom: -18px;
            transform: translateX(-50%);
            width: 72%;
            height: 13px;
            border-radius: 50%;
            background: radial-gradient(ellipse at center, rgba(255, 255, 255, 0.28), transparent 70%);
            animation: login-shadow 5s ease-in-out infinite;
            pointer-events: none;
        }
        [data-theme="light"] .login-logo-wrap::after {
            background: radial-gradient(ellipse at center, rgba(0, 0, 0, 0.35), transparent 70%);
        }
        @keyframes login-float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }
        @keyframes login-shadow {
            0%, 100% { transform: translateX(-50%) scale(1); opacity: 0.85; }
            50% { transform: translateX(-50%) scale(0.72); opacity: 0.4; }
        }

        .login-title {
            font-size: 26px; font-weight: 800; margin: 0 0 5px 0; letter-spacing: -0.5px;
            background: linear-gradient(90deg, var(--text-main), var(--primary-color));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
        }
        .login-subtitle { color: var(--primary-color); font-size: 14px; margin-bottom: 30px; font-weight: 600; }

        .login-form { width: 100%; }

        .input-group { margin-bottom: 20px; width: 100%; }
        .input-group label { display: block; margin-bottom: 8px; font-size: 14px; color: var(--text-muted); font-weight: 500; }
        .input-icon-wrap { position: relative; width: 100%; }
        .input-icon {
            position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
            width: 18px; height: 18px; color: var(--text-muted); pointer-events: none;
        }
        .input-group input {
            width: 100%; padding: 12px 15px 12px 44px; border-radius: 10px;
            background-color: rgba(255, 255, 255, 0.06); color: var(--text-main);
            border: 1px solid rgba(255, 255, 255, 0.1); font-size: 15px;
            transition: all 0.2s; box-sizing: border-box; outline: none;
        }
        .input-group input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary-color) 20%, transparent);
        }
        [data-theme="light"] .input-group input {
            background-color: rgba(0, 0, 0, 0.04);
            border-color: rgba(0, 0, 0, 0.12);
        }

        /* 品牌区与表单区的分隔线 */
        .login-divider {
            width: 100%;
            height: 1px;
            margin: 0 0 24px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.12), transparent);
        }

        .submit-btn {
            width: 100%; padding: 14px; border-radius: 8px;
            background: linear-gradient(135deg, var(--primary-color),
                    color-mix(in srgb, var(--primary-color) 70%, #000));
            color: #fff;
            border: none; font-size: 16px; font-weight: 600; cursor: pointer;
            transition: transform 0.2s, filter 0.2s, box-shadow 0.2s;
            box-shadow: 0 10px 24px color-mix(in srgb, var(--primary-color) 35%, transparent);
            margin-top: 10px;
        }
        .submit-btn:hover {
            transform: translateY(-2px);
            filter: brightness(1.08);
            box-shadow: 0 14px 32px color-mix(in srgb, var(--primary-color) 45%, transparent);
        }
        .submit-btn:active {
            transform: scale(0.98);
        }

        /* ====== ✨ 新增：注册链接样式 ====== */
        .register-link {
            margin-top: 25px;
            font-size: 14px;
            color: var(--text-muted);
            text-align: center;
            width: 100%;
        }
        .register-link a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 600;
            transition: filter 0.2s;
        }
        .register-link a:hover {
            filter: brightness(1.2);
            text-decoration: underline;
        }

        .flash {
            width: 100%; padding: 10px; border-radius: 8px; margin-bottom: 20px;
            background-color: rgba(239, 68, 68, 0.1); color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.2); font-size: 14px; text-align: center;
        }

        /* 尊重系统"减弱动态效果"设置 */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body style="{% if bg_url %}background-image:url('{{ bg_url }}');{% endif %}">

    <div class="top-navbar">
        <button class="theme-switch" onclick="toggleDarkMode(event)" id="mode-btn">🌙 深色模式</button>
        <div class="color-picker-container">
            <span style="font-size: 12px; color: var(--text-muted);">主题色:</span>
            <div class="color-dot" style="background-color: #00a4dc;" onclick="setPrimaryColor(event, '#00a4dc')"></div>
            <div class="color-dot" style="background-color: #8b5cf6;" onclick="setPrimaryColor(event, '#8b5cf6')"></div>
            <div class="color-dot" style="background-color: #10b981;" onclick="setPrimaryColor(event, '#10b981')"></div>
            <div class="color-dot" style="background-color: #f43f5e;" onclick="setPrimaryColor(event, '#f43f5e')"></div>
        </div>
    </div>

    <div class="login-card">
        <div class="login-logo-wrap">
            <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Logo" class="logo-img" decoding="async">
        </div>
        <h1 class="login-title">加入 JellyWall</h1>
        <div class="login-subtitle">创建你的专属账号</div>
        <div class="login-divider"></div>

        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <div class="flash">
                    {% for msg in messages %}{{ msg }}<br>{% endfor %}
                </div>
            {% endif %}
        {% endwith %}

        <form class="login-form" method="POST" action="{{ url_for('register') }}">
            <div class="input-group">
                <label for="username">用户名</label>
<div class="input-icon-wrap">
                    <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                    <input type="text" id="username" name="username" required placeholder="设置用户名">
                </div>
            </div>
            <div class="input-group">
                <label for="password">密码</label>
<div class="input-icon-wrap">
                    <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                    <input type="password" id="password" name="password" required placeholder="设置密码">
                </div>
            </div>
            <button type="submit" class="submit-btn">立即注册</button>
        </form>

        <div class="register-link">
            已有账号？ <a href="{{ url_for('login') }}">返回登录</a>
        </div>
        <div class="login-footer">JellyWall v{{ app_version }}</div>
    </div>

    <script>
        function triggerRippleAnimation(event, actionCallback) {
            const x = event ? event.clientX : window.innerWidth / 2;
            const y = event ? event.clientY : window.innerHeight / 2;
            document.documentElement.style.setProperty('--click-x', `${x}px`);
            document.documentElement.style.setProperty('--click-y', `${y}px`);

            if (!document.startViewTransition) { actionCallback(); return; }
            document.startViewTransition(() => {
                document.body.style.transition = 'none';
                actionCallback();
            });

            const speedStr = getComputedStyle(document.documentElement).getPropertyValue('--ripple-speed');
            const speedMs = parseFloat(speedStr) * 1000 || 1100;
            setTimeout(() => { document.body.style.transition = 'background-color 0.3s, color 0.3s'; }, speedMs);
        }

        function toggleDarkMode(event) {
            triggerRippleAnimation(event, () => {
                const htmlTag = document.documentElement;
                const modeBtn = document.getElementById('mode-btn');
                if (htmlTag.getAttribute('data-theme') === 'dark') {
                    htmlTag.setAttribute('data-theme', 'light');
                    modeBtn.innerHTML = '☀️ 浅色模式';
                    localStorage.setItem('jellywall_theme', 'light');
                } else {
                    htmlTag.setAttribute('data-theme', 'dark');
                    modeBtn.innerHTML = '🌙 深色模式';
                    localStorage.setItem('jellywall_theme', 'dark');
                }
            });
        }

        function setPrimaryColor(event, hexColor) {
            triggerRippleAnimation(event, () => {
                document.documentElement.style.setProperty('--primary-color', hexColor);
                localStorage.setItem('jellywall_primary_color', hexColor);
            });
        }

        document.addEventListener('DOMContentLoaded', function() {
            const savedTheme = localStorage.getItem('jellywall_theme');
            const modeBtn = document.getElementById('mode-btn');
            if (savedTheme) {
                document.documentElement.setAttribute('data-theme', savedTheme);
                modeBtn.innerHTML = savedTheme === 'dark' ? '🌙 深色模式' : '☀️ 浅色模式';
            }
            const savedColor = localStorage.getItem('jellywall_primary_color');
            if (savedColor) {
                document.documentElement.style.setProperty('--primary-color', savedColor);
            }
        });
    </script>
    <script>
        // 随机背景：同一会话刷新保持同一张图，新会话才换新图
        (function () {
            try {
                var key = 'jellywall_login_bg';
                var saved = sessionStorage.getItem(key);
                var current = document.body.style.backgroundImage;
                var m = current && current.match(/url\(['"]?(.+?)['"]?\)/);
                if (saved) {
                    document.body.style.backgroundImage = "url('" + saved + "')";
                } else if (m) {
                    sessionStorage.setItem(key, m[1]);
                }
            } catch (e) { }
        })();
    </script>
</body>
</html>
