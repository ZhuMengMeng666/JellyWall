<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>绑定 Jellyfin - JellyWall</title>
    <style>
        body { background-color: #121212; color: #fff; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background-color: #1e1e1e; padding: 40px; border-radius: 10px; box-shadow: 0 8px 16px rgba(0,0,0,0.5); width: 100%; max-width: 400px; }
        h2 { text-align: center; margin-top: 0; color: #00a4dc; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-size: 14px; color: #aaa; }
        .input-row { display: flex; gap: 10px; }
        input[type="text"], input[type="password"], input[type="number"] { width: 100%; padding: 12px; background-color: #2c2c2c; border: 1px solid #444; border-radius: 5px; color: white; box-sizing: border-box; }
        .url-input { flex: 3; } .port-input { flex: 1; }
        .checkbox-group { display: flex; align-items: center; gap: 8px; margin-bottom: 20px; font-size: 14px; color: #aaa; }
        button { width: 100%; padding: 14px; font-size: 16px; background-color: #00a4dc; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .flash { color: #ff4d4d; font-size: 14px; text-align: center; margin-bottom: 15px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>连接服务器</h2>
        <p style="text-align: center; color: #aaa; font-size: 14px; margin-bottom: 30px;">首次使用，请绑定你的 Jellyfin</p>
        {% with messages = get_flashed_messages() %}
            {% if messages %}<div class="flash">{% for msg in messages %}{{ msg }}{% endfor %}</div>{% endif %}
        {% endwith %}
        <form method="POST">
            <div class="form-group">
                <label>网址与端口 (例如: nas.local 或 192.168.1.100)</label>
                <div class="input-row">
                    <input type="text" name="host" class="url-input" placeholder="IP或域名" required>
                    <input type="number" name="port" class="port-input" placeholder="8096">
                </div>
            </div>
            <div class="checkbox-group">
                <input type="checkbox" id="is_https" name="is_https">
                <label for="is_https" style="margin: 0; cursor: pointer;">启用 HTTPS</label>
            </div>
            <div class="form-group">
                <label>Jellyfin 用户名</label>
                <input type="text" name="jf_username" required>
            </div>
            <div class="form-group">
                <label>Jellyfin 密码</label>
                <input type="password" name="jf_password">
            </div>
            <button type="submit">验证并绑定</button>
        </form>
    </div>
</body>
</html>
