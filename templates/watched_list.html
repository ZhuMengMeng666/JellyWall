{% extends 'base.html' %}

{% block content %}
<script src="{{ url_for('static', filename='js/Sortable.min.js') }}" defer></script>

<style>
    /* ====== CSS 渲染优化黑魔法 ====== */
    /* 强迫浏览器跳过屏幕外元素的渲染计算，长列表滚动将如丝般顺滑 */
    .library-details, .series-details, .season-details {
        content-visibility: auto;
        contain-intrinsic-size: auto 60px;
    }

    /* ====== 一级折叠：容器与外框 ====== */
    .group-container { display: flex; flex-direction: column; }
    .library-details { background-color: var(--sidebar-bg); border-radius: 10px; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); border: 1px solid var(--border-color); }
    .library-summary { padding: 20px; font-size: 20px; font-weight: bold; color: var(--primary-color); background-color: rgba(128, 128, 128, 0.03); border-radius: 10px; list-style: none; transition: background-color 0.2s, color 0.3s; cursor: grab; display: flex; align-items: center; gap: 10px;}
    .library-summary:active { cursor: grabbing; }
    .library-summary:hover { background-color: rgba(128, 128, 128, 0.08); }
    .library-summary::-webkit-details-marker { display: none; }
    .drag-handle { color: var(--text-muted); margin-right: 5px; cursor: grab; display: flex; align-items: center; }

    .library-details[open] > .library-summary { border-bottom-left-radius: 0; border-bottom-right-radius: 0; border-bottom: 2px solid var(--border-color); }
    .library-content { padding: 20px; }
    .sortable-ghost { opacity: 0.4; background-color: var(--bg-color); }

    /* ====== 二级折叠：剧集 ====== */
    .series-details { margin-bottom: 10px; background-color: rgba(128, 128, 128, 0.03); border-radius: 5px; }
    .series-summary { padding: 15px; cursor: pointer; font-weight: bold; color: var(--primary-color); background-color: var(--border-color); border-radius: 5px; list-style: none; transition: color 0.3s; display: flex; align-items: center; gap: 10px;}
    .series-summary:hover { filter: brightness(1.1); }
    .series-summary::-webkit-details-marker { display: none; }
    .series-details[open] > .series-summary { border-bottom-left-radius: 0; border-bottom-right-radius: 0; border-bottom: 1px solid var(--border-color); }

    /* ====== 三级折叠：季 ====== */
    .season-details { margin: 10px 15px 15px 15px; background-color: rgba(128, 128, 128, 0.02); border-radius: 4px;}
    .season-summary { background-color: rgba(128, 128, 128, 0.08); color: var(--text-main); padding: 10px 15px; font-weight: normal; list-style: none; cursor: pointer; border-radius: 4px; display: flex; align-items: center; gap: 10px;}
    .season-summary::-webkit-details-marker { display: none; }
    .season-details[open] > .season-summary { border-bottom-left-radius: 0; border-bottom-right-radius: 0;}

    /* ====== 统一折叠箭头动画 ====== */
    .fold-icon { margin-left: auto; color: var(--text-muted); transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
    details[open] > summary .fold-icon { transform: rotate(90deg); color: var(--primary-color); }

    /* ====== 普通表格样式 ====== */
    table { width: 100%; border-collapse: collapse; margin-top: 10px; margin-bottom: 10px; text-align: left; }
    th, td { padding: 12px 15px; border-bottom: 1px solid var(--border-color); transition: color 0.3s;}
    th { background-color: var(--border-color); color: var(--text-muted); font-weight: bold; }
    tr:hover { background-color: rgba(128, 128, 128, 0.05); }
    .sub-title { color: var(--text-muted); font-size: 16px; margin-bottom: 10px; margin-top: 15px; display: flex; align-items: center; gap: 8px;}

    /* ====== 视图切换器样式 ====== */
    .view-controls { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; margin-bottom: 20px; padding: 0 5px; flex-wrap: wrap; gap: 15px;}
    .view-toggle-btn { display: flex; background-color: color-mix(in srgb, var(--sidebar-bg) 50%, transparent); border-radius: 10px; padding: 4px; border: 1px solid var(--border-color); }
    .toggle-option { padding: 6px 16px; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: bold; color: var(--text-muted); transition: all 0.3s; display: flex; align-items: center; gap: 6px; }
    .toggle-option.active { background-color: var(--sidebar-bg); color: var(--primary-color); box-shadow: 0 2px 8px rgba(0,0,0,0.15); }

    /* ====== 自定义下拉组件样式 ====== */
    .custom-dropdown { position: relative; display: inline-block; width: 160px; z-index: 100; flex-shrink: 0; }
    .dropdown-selected {
        padding: 8px 12px; border-radius: 8px; background-color: var(--sidebar-bg); color: var(--text-main);
        border: 1px solid var(--border-color); font-size: 14px; font-weight: bold; cursor: pointer;
        display: flex; justify-content: space-between; align-items: center; transition: all 0.2s;
        height: 38px; box-sizing: border-box;
    }
    .dropdown-selected:hover { border-color: var(--primary-color); }
    .dropdown-options {
        position: absolute; top: calc(100% + 6px); left: 0; right: 0; background-color: var(--sidebar-bg);
        border: 1px solid var(--border-color); border-radius: 8px; box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        display: none; flex-direction: column; overflow: hidden;
        animation: fadeIn 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    .dropdown-options.show { display: flex; }
    .dropdown-option {
        padding: 10px 12px; font-size: 14px; font-weight: bold; color: var(--text-muted);
        cursor: pointer; transition: all 0.2s; display: flex; align-items: center; gap: 8px;
    }
    .dropdown-option:hover { background-color: rgba(128, 128, 128, 0.05); color: var(--text-main); }
    .dropdown-option.active { color: var(--primary-color); background-color: color-mix(in srgb, var(--primary-color) 10%, transparent); }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }

    /* ====== 双模显示/隐藏控制 ====== */
    .group-container.view-mode-list .poster-container { display: none; }
    .group-container.view-mode-list .list-container { display: block; }
    .group-container.view-mode-poster .list-container { display: none; }
    .group-container.view-mode-poster .poster-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 20px; padding: 10px 0; }

    /* ====== 海报卡片样式 ====== */
    .poster-item { position: relative; border-radius: 12px; overflow: hidden; aspect-ratio: 2/3; box-shadow: 0 6px 15px rgba(0,0,0,0.1); transition: transform 0.3s, box-shadow 0.3s; background-color: #222; cursor: pointer; }
    .poster-item:hover { transform: translateY(-5px); box-shadow: 0 12px 25px rgba(0,0,0,0.2); }
    .poster-item img { width: 100%; height: 100%; object-fit: cover; }
    .poster-info { position: absolute; bottom: 0; left: 0; right: 0; padding: 40px 15px 15px 15px; background: linear-gradient(to top, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.5) 60%, transparent 100%); color: #fff; }
    .poster-title { font-weight: bold; font-size: 14px; margin-bottom: 5px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .poster-time { font-size: 12px; color: #bbb; }

    /* ====== 编辑模式与悬浮动作栏样式 ====== */
    .history-checkbox { display: none; width: 16px; height: 16px; cursor: pointer; margin-right: 4px; accent-color: var(--primary-color); flex-shrink: 0; }
    .edit-mode .history-checkbox { display: inline-block; }

    .edit-btn { background: transparent; border: 1px solid var(--primary-color); color: var(--primary-color); padding: 6px 14px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 14px; display: flex; align-items: center; gap: 6px; transition: all 0.2s; }
    .edit-btn:hover { background: color-mix(in srgb, var(--primary-color) 10%, transparent); }

    .floating-action-bar { position: fixed; bottom: -100px; left: 50%; transform: translateX(-50%); background: rgba(30, 30, 30, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); padding: 12px 24px; border-radius: 50px; box-shadow: 0 10px 40px rgba(0,0,0,0.4); display: flex; align-items: center; gap: 20px; z-index: 1000; transition: bottom 0.4s cubic-bezier(0.2, 0.8, 0.2, 1); }
    .floating-action-bar.show { bottom: 40px; }
    .action-buttons { display: flex; gap: 10px; align-items: center; }

    .btn-danger { background: #ef4444; color: white; border: none; padding: 10px 20px; border-radius: 30px; cursor: pointer; font-weight: bold; font-size: 14px; transition: background 0.2s; display: flex; align-items: center; justify-content: center; gap: 6px;}
    .btn-danger:hover { background: #dc2626; }
    .btn-primary { background: #3b82f6; color: white; border: none; padding: 10px 20px; border-radius: 30px; cursor: pointer; font-weight: bold; font-size: 14px; transition: background 0.2s; display: flex; align-items: center; justify-content: center; gap: 6px;}
    .btn-primary:hover { filter: brightness(1.1); }
    .btn-cancel { background: transparent; color: #bbb; border: 1px solid #bbb; padding: 10px 20px; border-radius: 30px; cursor: pointer; font-weight: bold; font-size: 14px; transition: all 0.2s; display: flex; align-items: center; justify-content: center; }
    .btn-cancel:hover { background: rgba(255,255,255,0.1); color: #fff; }

    /* ====== 同步及时间弹窗 ====== */
    .sync-overlay { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.6); z-index: 10000; align-items: center; justify-content: center; backdrop-filter: blur(5px); opacity: 0; transition: opacity 0.3s ease; }
    .sync-modal-box { background: var(--sidebar-bg); border: 1px solid var(--border-color); border-radius: 12px; width: 420px; padding: 20px 24px; box-shadow: 0 25px 50px rgba(0,0,0,0.5); transform: scale(0.95); transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1); display: flex; flex-direction: column; }
    .sync-modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
    .sync-modal-header span { color: var(--text-main); font-size: 14px; font-weight: 700; letter-spacing: 0.5px; }
    .sync-close-btn { background: transparent; border: 1px solid var(--border-color); color: var(--text-muted); border-radius: 6px; padding: 4px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
    .sync-close-btn:hover { border-color: var(--primary-color); color: var(--primary-color); background: color-mix(in srgb, var(--primary-color) 10%, transparent); }
    .sync-modal-body { display: flex; gap: 24px; align-items: center; padding-bottom: 10px;}
    .sync-spinner-box { width: 50px; height: 50px; background: color-mix(in srgb, var(--primary-color) 15%, transparent); border: 1px solid color-mix(in srgb, var(--primary-color) 30%, transparent); border-radius: 14px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .sync-spinner { width: 24px; height: 24px; border: 3px solid color-mix(in srgb, var(--primary-color) 30%, transparent); border-top-color: var(--primary-color); border-radius: 50%; animation: spin-ring 1s linear infinite; }
    @keyframes spin-ring { to { transform: rotate(360deg); } }
    .sync-text-box { display: flex; flex-direction: column; overflow: hidden; flex: 1; }
    .sync-title { font-size: 16px; color: var(--text-main); font-weight: 800; margin-bottom: 4px; letter-spacing: 0.5px;}
    .sync-subtitle { font-size: 13px; color: var(--text-muted); font-style: italic; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;}
    .datetime-input { width: 100%; padding: 12px 15px; border-radius: 8px; background-color: var(--bg-color); color: var(--text-main); border: 1px solid var(--border-color); outline: none; font-size: 15px; font-family: monospace; box-sizing: border-box; transition: 0.3s; }
    .datetime-input:focus { border-color: var(--primary-color); box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary-color) 20%, transparent); }

    /* ====== 缺失数据急救弹窗专属样式 ====== */
    .wa-modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.6); z-index: 10000; align-items: center; justify-content: center; backdrop-filter: blur(5px); }
    .wa-modal-content { background: var(--sidebar-bg); border: 1px solid var(--border-color); border-radius: 12px; width: 90%; max-width: 650px; max-height: 85vh; display: flex; flex-direction: column; box-shadow: 0 25px 50px rgba(0,0,0,0.5); }
    .wa-modal-header { padding: 20px 24px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
    .wa-modal-header h3 { margin: 0; font-size: 18px; color: var(--text-main); }
    .wa-modal-body { padding: 20px 24px; overflow-y: auto; flex: 1; }
    .wa-modal-footer { padding: 15px 24px; border-top: 1px solid var(--border-color); display: flex; justify-content: flex-end; gap: 12px; }
    .wa-group-header { background: color-mix(in srgb, var(--bg-color) 50%, transparent); border: 1px solid var(--border-color) !important; border-radius: 8px; transition: all 0.2s; }
    .wa-group-header:hover { background: var(--bg-color); }
    .wa-badge { font-size: 12px; padding: 2px 6px; border-radius: 4px; margin-left: 10px; font-weight: bold; }
    .wa-badge.movie { background: rgba(59, 130, 246, 0.15); color: #3b82f6; border: 1px solid rgba(59, 130, 246, 0.3); }
    .wa-badge.tv { background: rgba(139, 92, 246, 0.15); color: #8b5cf6; border: 1px solid rgba(139, 92, 246, 0.3); }

    /* ✨ 新增弹窗控制按钮标准样式 */
    .wa-btn-cancel { padding: 10px 20px; border-radius: 8px; font-size: 14px; font-weight: bold; cursor: pointer; background: transparent; border: 1px solid var(--border-color); color: var(--text-muted); transition: all 0.2s; }
    .wa-btn-cancel:hover { border-color: var(--primary-color); color: var(--primary-color); background: color-mix(in srgb, var(--primary-color) 10%, transparent); }
    .wa-btn-primary { padding: 10px 20px; border-radius: 8px; font-size: 14px; font-weight: bold; cursor: pointer; background: var(--primary-color); color: white; border: none; transition: transform 0.2s, filter 0.2s; box-shadow: 0 4px 6px rgba(0,0,0,0.1); display: inline-flex; align-items: center; gap: 6px; }
    .wa-btn-primary:hover { filter: brightness(1.1); transform: translateY(-2px); }

    /* ====== 响应式防挤压 ====== */
    @media (max-width: 768px) {
        .alert-box { flex-direction: column !important; align-items: flex-start !important; gap: 15px; }
        .alert-box a, .alert-box a button { width: 100%; justify-content: center; }
        .view-controls { flex-direction: column; align-items: flex-start; gap: 15px; }
        .view-controls > div { width: 100%; justify-content: space-between; flex-wrap: wrap;}
        .floating-action-bar { flex-direction: column; width: 92%; border-radius: 20px; padding: 15px; text-align: center; bottom: -280px !important; gap: 12px; }
        .floating-action-bar.show { bottom: 20px !important; }
        .action-buttons { flex-direction: column; width: 100%; gap: 10px; }
        .action-buttons button { width: 100%; padding: 12px; }
        .group-container.view-mode-poster .poster-container { grid-template-columns: repeat(3, 1fr) !important; gap: 12px; padding: 10px 5px; }
        .poster-info { padding: 15px 5px 8px 5px; }
        .poster-title { font-size: 11px; }
        .poster-time { font-size: 10px; }
        .sync-modal-box { width: 90%; padding: 20px; }
    }
</style>

<div class="alert-box" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; background-color: var(--sidebar-bg); padding: 15px 20px; border-radius: 10px; border: 1px solid var(--border-color); box-shadow: 0 4px 6px rgba(0,0,0,0.05);">
    <div style="color: var(--text-muted); font-size: 14px; line-height: 1.6; display: flex; align-items: flex-start; gap: 10px;">
        <i data-lucide="lightbulb" style="color: var(--primary-color); flex-shrink: 0; width: 18px; height: 18px; margin-top: 2px;"></i>
        <div>
            <span style="color: var(--primary-color); font-weight: bold;">提示：</span>首次同步可能需要较长时间，请耐心等待。<br>
            如海报库出现占位图或遗漏解析情况，可通过补全引擎一键调用检索修复缺失元数据。
        </div>
    </div>

    <div style="display: flex; gap: 12px; flex-wrap: wrap;">
        <!-- 新增：补全数据入口按钮 (增加 type="button" 阻断刷新) -->
        <button type="button" id="check-missing-btn" style="padding: 10px 20px; font-size: 14px; font-weight: bold; background-color: transparent; border: 1px solid var(--primary-color); color: var(--primary-color); border-radius: 8px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; transition: all 0.2s;" onclick="openMissingDataModal(event)">
            <i data-lucide="scan-search" style="width: 16px; height: 16px;"></i>
            <span>检查补全数据</span>
        </button>

        <a href="{{ url_for('sync_history') }}" style="text-decoration: none;" onclick="handleSyncClick(this, event)">
            <button id="sync-btn" style="padding: 10px 24px; font-size: 15px; font-weight: 600; background-color: var(--primary-color); color: white; border: none; border-radius: 8px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); transition: transform 0.2s, filter 0.2s;">
                <i data-lucide="refresh-cw" id="sync-icon" style="width: 16px; height: 16px;"></i>
                <span id="sync-text">同步最新记录</span>
            </button>
        </a>
    </div>
</div>

<div class="view-controls">
    <div style="display: flex; align-items: center; gap: 15px;">
        <h2 style="font-size: 20px; font-weight: 800; color: var(--text-main); margin: 0;">观看历史记录</h2>
        <button class="edit-btn" id="edit-btn" onclick="toggleEditMode()">
            <i data-lucide="pencil" style="width: 16px; height: 16px;"></i> 进入编辑
        </button>
    </div>
    <div style="display: flex; gap: 15px; flex-wrap: wrap;">

        <div class="custom-dropdown" id="group-dropdown">
            <div class="dropdown-selected" onclick="toggleGroupDropdown(event)">
                <span id="group-dropdown-text">按媒体库分组</span>
                <i data-lucide="chevron-down" style="width: 16px; height: 16px; transition: transform 0.3s;" id="group-dropdown-icon"></i>
            </div>
            <div class="dropdown-options" id="group-dropdown-options">
                <div class="dropdown-option active" data-value="library" onclick="selectGroupOption('library', '按媒体库分组', event)">
                    <i data-lucide="folder-tree" style="width: 14px; height: 14px;"></i> 按媒体库分组
                </div>
                <div class="dropdown-option" data-value="type" onclick="selectGroupOption('type', '按类型分组', event)">
                    <i data-lucide="film" style="width: 14px; height: 14px;"></i> 按类型分组
                </div>
            </div>
        </div>

        <div class="view-toggle-btn">
            <div class="toggle-option active" onclick="switchView('list')" id="btn-list">
                <i data-lucide="list" style="width: 16px; height: 16px;"></i> 列表
            </div>
            <div class="toggle-option" onclick="switchView('poster')" id="btn-poster">
                <i data-lucide="layout-grid" style="width: 16px; height: 16px;"></i> 海报
            </div>
        </div>
    </div>
</div>

<!-- ==============================================
     🌟 核心重构：唯一动态渲染容器
     抛弃了双重 DOM 树，改用前端 JS 极速按需组装
     ============================================== -->
<div id="dynamic-render-container" class="group-container view-mode-list">
    <!-- 数据将通过 JS 瞬间注入到这里 -->
</div>

<div class="floating-action-bar" id="delete-bar">
    <span style="color: #fff; font-size: 15px; white-space: nowrap;">已选择 <b id="sel-count" style="color: var(--primary-color); font-size: 18px; margin: 0 4px;">0</b> 项记录</span>
    <div class="action-buttons">
        <button class="btn-cancel" onclick="toggleEditMode()">取消</button>
        <button class="btn-primary" onclick="openDateModal()">
            <i data-lucide="calendar-clock" style="width: 16px; height: 16px;"></i> 修改时间
        </button>
        <button class="btn-danger" onclick="confirmDelete()">
            <i data-lucide="trash-2" style="width: 16px; height: 16px;"></i> 移除
        </button>
    </div>
</div>

<div id="sync-modal-overlay" class="sync-overlay">
    <div class="sync-modal-box">
        <div class="sync-modal-header">
            <span>Jellyfin Sync</span>
            <button class="sync-close-btn" onclick="cancelSync()"><i data-lucide="x" style="width: 14px; height: 14px;"></i></button>
        </div>
        <div class="sync-modal-body">
            <div class="sync-spinner-box"><div class="sync-spinner"></div></div>
            <div class="sync-text-box">
                <div class="sync-title">同步中,请勿关闭/重启此项目</div>
                <div class="sync-subtitle" id="sync-status-sub">正在连接服务器...</div>
            </div>
        </div>
    </div>
</div>

<div id="date-modal-overlay" class="sync-overlay">
    <div class="sync-modal-box">
        <div class="sync-modal-header">
            <span>修改观看时间</span>
            <button class="sync-close-btn" onclick="closeDateModal()"><i data-lucide="x" style="width: 14px; height: 14px;"></i></button>
        </div>
        <div class="sync-modal-body" style="flex-direction: column; align-items: stretch; gap: 15px;">
            <label style="color: var(--text-muted); font-size: 13px;">请选择新的完成观看时间：</label>
            <input type="datetime-local" id="new-watch-date" class="datetime-input">
            <button onclick="confirmDateChange()" style="width: 100%; padding: 12px; border-radius: 8px; background: var(--primary-color); color: white; border: none; font-weight: bold; cursor: pointer; margin-top: 5px; font-size: 15px; transition: 0.2s;">确认保存</button>
        </div>
    </div>
</div>

<!-- ✨ 修改后的：缺失数据汇总补全确认浮窗 -->
<div id="missing-data-modal" class="wa-modal-overlay">
    <div class="wa-modal-content" style="max-width: 650px;">
        <div class="wa-modal-header">
            <h3 style="display: flex; align-items: center; gap: 8px;"><i data-lucide="scan-search" style="color: var(--primary-color);"></i> 检查结果</h3>
        </div>
        <div class="wa-modal-body">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; padding: 0 5px;">
                <label style="font-size: 14px; font-weight: bold; cursor: pointer; color: var(--text-main); display: flex; align-items: center; gap: 8px;">
                    <input type="checkbox" id="missing-select-all" checked style="accent-color: var(--primary-color); transform: scale(1.1);" onchange="toggleAllMissingItems(this.checked)"> 全选所有缺失资产
                </label>
            </div>

            <div id="missing-items-container" style="display: flex; flex-direction: column; gap: 10px;">
                <!-- 动态渲染缺失清单 -->
            </div>
        </div>
        <div class="wa-modal-footer">
            <button class="wa-btn-cancel" onclick="document.getElementById('missing-data-modal').style.display='none'">稍后处理</button>
            <button class="wa-btn-primary" id="confirm-patch-btn" onclick="executeDataPatch()">确认补全</button>
        </div>
    </div>
</div>

<script>
    // ========================================================
    // ✨ 核心重构：注入 JSON，前端纯净 DOM 渲染引擎
    // ========================================================
    const rawLibraryData = {{ library_data | tojson | safe }};
    const rawTypeData = {{ type_data | tojson | safe }};
    let currentGroupMode = 'library'; // 'library' or 'type'
    let activeRenderMode = 'library'; // 当前渲染模式，供详情页链接区分媒体库/类型视图
    let isEditMode = false;
    let sortableInstance = null;

    function renderDynamicDOM(mode) {
        activeRenderMode = mode;
        const dataDict = mode === 'type' ? rawTypeData : rawLibraryData;
        const container = document.getElementById('dynamic-render-container');
        let htmlStr = '';

        if (Object.keys(dataDict).length === 0) {
            htmlStr = `
            <div style="text-align: center; color: var(--text-muted); padding: 80px 20px; background-color: var(--sidebar-bg); border-radius: 10px; border: 1px solid var(--border-color);">
                <i data-lucide="package-open" style="width: 64px; height: 64px; margin: 0 auto 15px auto; display: block; opacity: 0.5;"></i>
                <p style="font-size: 16px;">本地数据库暂无记录，请点击上方按钮进行同步。</p>
            </div>`;
            container.innerHTML = htmlStr;
            if (typeof lucide !== 'undefined') lucide.createIcons();
            return;
        }

        // 恢复这组数据的保存折叠/展开状态
        const savedOrder = JSON.parse(localStorage.getItem('jellywall_order_' + mode)) || [];
        const entries = Object.entries(dataDict);

        // 按照用户拖拽保存的顺序重新排列
        entries.sort((a, b) => {
            const indexA = savedOrder.indexOf(a[0]);
            const indexB = savedOrder.indexOf(b[0]);
            if (indexA !== -1 && indexB !== -1) return indexA - indexB;
            if (indexA !== -1) return -1;
            if (indexB !== -1) return 1;
            return 0;
        });

        // 优化:只渲染外层卡片,内部内容在展开时按需填充
        entries.forEach(([groupName]) => {
            let iconName = 'folder-open';
            if (groupName.includes('电影')) iconName = 'clapperboard';
            else if (groupName.includes('剧集')) iconName = 'tv';

            // 读取记忆的折叠状态
            const isOpen = sessionStorage.getItem('jellywall_open_state_' + groupName) === 'true' ? 'open' : '';

            htmlStr += `
            <details class="library-details" data-id="${groupName}" ${isOpen}>
                <summary class="library-summary" onclick="setTimeout(()=>sessionStorage.setItem('jellywall_open_state_${groupName}', this.parentElement.open), 50)">
                    <span class="drag-handle"><i data-lucide="grip-vertical" style="width: 18px; height: 18px;"></i></span>
                    <i data-lucide="${iconName}" style="width: 22px; height: 22px;"></i>
                    ${groupName}
                    <i data-lucide="chevron-right" class="fold-icon"></i>
                </summary>
                <div class="library-content">
                    <div class="library-content-fill" data-group="${groupName}"></div>
                </div>
            </details>
            `;
        });

        container.innerHTML = htmlStr;

        // 如果正处于编辑模式，渲染完也要让所有的勾选框漏出来
        if (isEditMode) container.classList.add('edit-mode');

        // 展开时按需填充;已记忆为展开状态的卡片立即填充
        // 注意:必须等 container.innerHTML 注入后再挂载监听,否则监听器会挂在被替换的旧节点上
        container.querySelectorAll('details.library-details').forEach(det => {
            const fill = () => {
                if (det.open) fillLibraryContent(det, dataDict[det.getAttribute('data-id')]);
            };
            det.addEventListener('toggle', fill);
            // 兜底:部分浏览器对 details 的 toggle 事件支持不佳,改为 summary 点击后延迟检查
            const summaryEl = det.querySelector('.library-summary');
            if (summaryEl) summaryEl.addEventListener('click', () => setTimeout(fill, 0));
            if (det.open) fill();
        });

        if (typeof lucide !== 'undefined') lucide.createIcons();

        // 重新挂载拖拽逻辑
        if (sortableInstance) sortableInstance.destroy();
        sortableInstance = Sortable.create(container, {
            animation: 150, handle: '.library-summary', ghostClass: 'sortable-ghost',
            onEnd: function () {
                const currentOrder = Array.from(container.children).map(el => el.getAttribute('data-id')).filter(id => id);
                localStorage.setItem('jellywall_order_' + mode, JSON.stringify(currentOrder));
            }
        });
    }

    // 按需填充某张媒体库卡片的完整内容(首次展开时执行一次)
    function fillLibraryContent(detailsEl, data) {
        // 防御:数据缺失时不标记 filled,避免永久空白且失去重试机会
        if (!data || typeof data !== 'object') return;
        const fillEl = detailsEl.querySelector('.library-content-fill');
        if (!fillEl || fillEl.dataset.filled === '1') return;
        fillEl.dataset.filled = '1';
        const libName = activeRenderMode === 'library' ? detailsEl.getAttribute('data-id') : null;
        fillEl.innerHTML = buildLibraryContent(data, libName);
        if (typeof lucide !== 'undefined') lucide.createIcons();
    }

    // 原 renderDynamicDOM 中构建媒体库内容的逻辑,原样搬移至此
    function buildLibraryContent(data, libName) {
        let htmlStr = '<div class="list-container">';
        const hasEpisodes = Object.keys(data.episodes_tree || {}).length > 0;
        const hasMovies = (data.movies || []).length > 0;

        if (hasEpisodes) {
            htmlStr += `<div class="sub-title"><i data-lucide="tv" style="width: 18px; height: 18px;"></i> 包含剧集</div>`;
            for (const [seriesName, seasons] of Object.entries(data.episodes_tree)) {
                htmlStr += `
                <details class="series-details">
                    <summary class="series-summary">
                        <input type="checkbox" class="history-checkbox chk-series" data-series-id="${seriesName}" onclick="event.stopPropagation();">
                        ${seriesName}
                        <i data-lucide="chevron-right" class="fold-icon"></i>
                    </summary>`;
                for (const [seasonName, episodes] of Object.entries(seasons)) {
                    htmlStr += `
                    <details class="season-details">
                        <summary class="season-summary">
                            <input type="checkbox" class="history-checkbox chk-season" data-series-parent="${seriesName}" data-season-id="${seasonName}" onclick="event.stopPropagation();">
                            ${seasonName}
                            <i data-lucide="chevron-right" class="fold-icon"></i>
                        </summary>
                        <table style="margin-top: 0; margin-bottom: 0; border-top: 1px solid var(--border-color);">
                            <thead><tr><th>单集详情</th><th>完成观看时间</th></tr></thead>
                            <tbody>`;
                    episodes.forEach(ep => {
                        htmlStr += `
                            <tr>
                                <td style="color: var(--text-main); display: flex; align-items: center;">
                                    <input type="checkbox" class="history-checkbox chk-episode" data-series-parent="${seriesName}" data-season-parent="${seasonName}" value="${ep.id}">
                                    ${ep.episode}
                                </td>
                                <td style="color: var(--text-muted); font-size: 14px; width: 180px;">${ep.date}</td>
                            </tr>`;
                    });
                    htmlStr += `</tbody></table></details>`;
                }
                htmlStr += `</details>`;
            }
        }

        if (hasEpisodes && hasMovies) {
            htmlStr += `<hr style="border-color: var(--border-color); margin: 25px 0;">`;
        }

        if (hasMovies) {
            htmlStr += `
            <div class="sub-title"><i data-lucide="film" style="width: 18px; height: 18px;"></i> 包含电影</div>
            <table>
                <thead><tr><th>电影名称</th><th>完成观看时间</th></tr></thead>
                <tbody>`;
            data.movies.forEach(mv => {
                htmlStr += `
                    <tr>
                        <td style="font-weight: bold; color: var(--primary-color); display: flex; align-items: center;">
                            <input type="checkbox" class="history-checkbox chk-episode" value="${mv.id}">
                            ${mv.name}
                        </td>
                        <td style="color: var(--text-muted); font-size: 14px; width: 180px;">${mv.date}</td>
                    </tr>`;
            });
            htmlStr += `</tbody></table>`;
        }

        htmlStr += `</div><div class="poster-container">`;

        // 海报渲染区
        for (const [seriesName, posterPath] of Object.entries(data.series_posters || {})) {
            const seriesHref = libName
                ? `/detail/series/${encodeURIComponent(seriesName)}?lib=${encodeURIComponent(libName)}`
                : `/detail/series/${encodeURIComponent(seriesName)}`;
            htmlStr += `
            <a href="${seriesHref}" class="poster-item" style="text-decoration: none;">
                <img src="/static/${posterPath}" loading="lazy" decoding="async">
                <div class="poster-info">
                    <div class="poster-title">${seriesName}</div>
                    <div class="poster-time">剧集</div>
                </div>
            </a>`;
        }

        (data.movies || []).forEach(mv => {
            const pPath = mv.poster_path || 'images/logo.png';
            const mvHref = libName
                ? `/detail/movie/${encodeURIComponent(mv.name)}?lib=${encodeURIComponent(libName)}`
                : `/detail/movie/${encodeURIComponent(mv.name)}`;
            htmlStr += `
            <a href="${mvHref}" class="poster-item" style="text-decoration: none;">
                <img src="/static/${pPath}" loading="lazy" decoding="async">
                <div class="poster-info">
                    <div class="poster-title">${mv.name}</div>
                    <div class="poster-time">${mv.date}</div>
                </div>
            </a>`;
        });

        htmlStr += `</div>`;
        return htmlStr;
    }

    // ==========================================
    // 常规控制与事件绑定
    // ==========================================
    document.addEventListener('DOMContentLoaded', function () {
        // 恢复用户设定的视图模式与分组模式
        const savedViewMode = localStorage.getItem('historyViewMode') || 'list';
        const savedGroupMode = localStorage.getItem('historyGroupMode') || 'library';

        switchGroup(savedGroupMode); // 里面会自动调用 renderDynamicDOM
        switchView(savedViewMode);
    });

    window.toggleGroupDropdown = function(e) {
        e.stopPropagation();
        const options = document.getElementById('group-dropdown-options');
        const icon = document.getElementById('group-dropdown-icon');
        options.classList.toggle('show');
        icon.style.transform = options.classList.contains('show') ? 'rotate(180deg)' : 'rotate(0)';
    };

    window.selectGroupOption = function(value, text, e) {
        e.stopPropagation();
        document.getElementById('group-dropdown-text').innerText = text;
        document.querySelectorAll('.dropdown-option').forEach(el => el.classList.remove('active'));
        e.currentTarget.classList.add('active');
        document.getElementById('group-dropdown-options').classList.remove('show');
        document.getElementById('group-dropdown-icon').style.transform = 'rotate(0)';
        switchGroup(value);
    };

    document.addEventListener('click', function(e) {
        const options = document.getElementById('group-dropdown-options');
        if (options && options.classList.contains('show') && !e.target.closest('.custom-dropdown')) {
            options.classList.remove('show');
            document.getElementById('group-dropdown-icon').style.transform = 'rotate(0)';
        }
    });

    window.switchGroup = function(mode) {
        currentGroupMode = mode;
        const textSpan = document.getElementById('group-dropdown-text');
        if (textSpan) {
            textSpan.innerText = mode === 'type' ? '按类型分组' : '按媒体库分组';
            document.querySelectorAll('.dropdown-option').forEach(el => {
                if (el.getAttribute('data-value') === mode) el.classList.add('active');
                else el.classList.remove('active');
            });
        }
        localStorage.setItem('historyGroupMode', mode);

        // 触发极速渲染引擎
        renderDynamicDOM(mode);
    };

    window.switchView = function(mode) {
        const container = document.getElementById('dynamic-render-container');
        const listBtn = document.getElementById('btn-list');
        const posterBtn = document.getElementById('btn-poster');

        if (mode === 'poster') {
            posterBtn.classList.add('active'); listBtn.classList.remove('active');
            container.classList.remove('view-mode-list'); container.classList.add('view-mode-poster');
            localStorage.setItem('historyViewMode', 'poster');
        } else {
            listBtn.classList.add('active'); posterBtn.classList.remove('active');
            container.classList.remove('view-mode-poster'); container.classList.add('view-mode-list');
            localStorage.setItem('historyViewMode', 'list');
        }
    };

    window.handleSyncClick = function(linkElement, event) {
        event.preventDefault();
        const overlay = document.getElementById('sync-modal-overlay');
        const modal = overlay.querySelector('.sync-modal-box');
        const subText = document.getElementById('sync-status-sub');
        overlay.style.display = 'flex'; void overlay.offsetWidth; overlay.style.opacity = '1'; modal.style.transform = 'scale(1)';
        if (typeof lucide !== 'undefined') lucide.createIcons();
        subText.innerText = "正在建立流式连接...";
        const eventSource = new EventSource('/api/sync_stream');
        eventSource.onmessage = function(event) {
            const data = JSON.parse(event.data);
            if (data.status === 'syncing') subText.innerText = "正在同步：" + data.name;
            else if (data.status === 'done') { subText.innerText = "同步完毕，正在重载媒体库..."; eventSource.close(); setTimeout(() => window.location.reload(), 1000); }
            else if (data.status === 'error') { subText.innerText = "Error: " + data.message; eventSource.close(); }
        };
        eventSource.onerror = function() { subText.innerText = "Error: 连接意外断开"; eventSource.close(); };
        window.currentSyncStream = eventSource;
    };

    window.cancelSync = function() {
        if (window.currentSyncStream) window.currentSyncStream.close();
        const overlay = document.getElementById('sync-modal-overlay');
        overlay.style.opacity = '0'; setTimeout(() => { overlay.style.display = 'none'; }, 300);
    };

    window.toggleEditMode = function() {
        isEditMode = !isEditMode;
        const container = document.getElementById('dynamic-render-container');
        const editBtn = document.getElementById('edit-btn');
        const deleteBar = document.getElementById('delete-bar');

        if (isEditMode) {
            container.classList.add('edit-mode');
            editBtn.innerHTML = '<i data-lucide="x" style="width: 16px; height: 16px;"></i> 退出编辑';
            deleteBar.classList.add('show');
            if (!document.getElementById('btn-list').classList.contains('active')) switchView('list');
        } else {
            container.classList.remove('edit-mode');
            editBtn.innerHTML = '<i data-lucide="pencil" style="width: 16px; height: 16px;"></i> 进入编辑';
            deleteBar.classList.remove('show');
            document.querySelectorAll('.history-checkbox').forEach(chk => chk.checked = false);
            updateSelectedCount();
        }
        if (typeof lucide !== 'undefined') lucide.createIcons();
    };

    // ====== 优化后的级联事件监听 ======
    document.addEventListener('change', function(e) {
        if (!e.target.classList.contains('history-checkbox')) return;
        const isChecked = e.target.checked;
        const val = e.target.value;

        if (e.target.classList.contains('chk-episode')) {
            document.querySelectorAll(`.chk-episode[value="${val}"]`).forEach(chk => chk.checked = isChecked);
        }

        if (e.target.classList.contains('chk-series')) {
            const seriesId = e.target.dataset.seriesId;
            document.querySelectorAll(`.history-checkbox[data-series-parent="${seriesId}"]`).forEach(chk => chk.checked = isChecked);
        }
        else if (e.target.classList.contains('chk-season')) {
            const seasonId = e.target.dataset.seasonId;
            const seriesId = e.target.dataset.seriesParent;
            document.querySelectorAll(`.chk-episode[data-season-parent="${seasonId}"][data-series-parent="${seriesId}"]`).forEach(chk => {
                const epVal = chk.value;
                document.querySelectorAll(`.chk-episode[value="${epVal}"]`).forEach(c => c.checked = isChecked);
            });
        }
        updateSelectedCount();
    });

    window.updateSelectedCount = function() {
        const selectedIds = new Set();
        document.querySelectorAll('.chk-episode:checked').forEach(chk => selectedIds.add(chk.value));
        document.getElementById('sel-count').innerText = selectedIds.size;
    };

    window.openDateModal = function() {
        const selected = document.querySelectorAll('.chk-episode:checked');
        if (selected.length === 0) { window.showToast("请先勾选要修改时间的记录"); return; }
        const overlay = document.getElementById('date-modal-overlay');
        overlay.style.display = 'flex'; void overlay.offsetWidth; overlay.style.opacity = '1'; overlay.querySelector('.sync-modal-box').style.transform = 'scale(1)';
        const now = new Date(); now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
        document.getElementById('new-watch-date').value = now.toISOString().slice(0,16);
    };

    window.closeDateModal = function() {
        const overlay = document.getElementById('date-modal-overlay');
        overlay.style.opacity = '0'; setTimeout(() => { overlay.style.display = 'none'; }, 300);
    };

    window.confirmDateChange = async function() {
        const selectedIds = new Set();
        document.querySelectorAll('.chk-episode:checked').forEach(chk => selectedIds.add(parseInt(chk.value)));
        const newDateStr = document.getElementById('new-watch-date').value;
        if (!newDateStr) { window.showToast("请选择一个有效的时间"); return; }
        if (selectedIds.size === 0) return;

        try {
            window.showToast("正在更新时间...");
            const response = await fetch('/api/update_history_date', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ record_ids: Array.from(selectedIds), new_date: newDateStr })
            });
            const result = await response.json();
            if (result.success) { window.showToast(result.message); closeDateModal(); setTimeout(() => location.reload(), 1000); }
            else window.showToast("修改失败: " + result.message);
        } catch (error) { window.showToast("网络请求异常"); }
    };

    window.confirmDelete = async function() {
        const selectedIds = new Set();
        document.querySelectorAll('.chk-episode:checked').forEach(chk => selectedIds.add(parseInt(chk.value)));
        if (selectedIds.size === 0) { window.showToast("请先勾选要移除的媒体记录"); return; }
        if (!confirm(`确定要从历史记录中移除这 ${selectedIds.size} 项吗？\n\n（注意：这仅会在本地历史中隐藏，绝对不会删除您媒体服务器上的真实文件）`)) return;

        try {
            window.showToast("正在清理足迹...");
            const response = await fetch('/api/delete_history', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ record_ids: Array.from(selectedIds) })
            });
            const result = await response.json();
            if (result.success) { window.showToast(result.message); setTimeout(() => location.reload(), 1000); }
            else window.showToast("删除失败: " + result.message);
        } catch (error) { window.showToast("网络请求异常"); }
    };

    // ========================================================
    // 🛠️ 刮削急救与补全控制体系
    // ========================================================
    let missingPayload = []; // 存储扫描到的残缺媒体对象

    window.openMissingDataModal = async function(event) {
    // 🚨 防御塔1：强行阻止任何可能的页面跳转或刷新行为
    if (event) event.preventDefault();

    const btn = document.getElementById('check-missing-btn');
    const originalHtml = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = `<i data-lucide="loader-2" class="wa-spin-anim" style="width: 16px; height: 16px;"></i> <span>矩阵扫描中...</span>`;
    if (typeof lucide !== 'undefined') lucide.createIcons();

    try {
        console.log("🚀 [DataCheck] 开始请求后端接口...");
        const resp = await fetch('/api/check_missing_data');

        // 🚨 防御塔2：如果后端崩了（比如 500），改用 Toast 提示
        if (!resp.ok) {
            window.showToast(`❌ 后端请求失败！状态码: ${resp.status}`);
            return;
        }

        const res = await resp.json();
        console.log("📦 [DataCheck] 后端返回的数据:", res);

        if (res.status === 'success') {
            missingPayload = res.data;
            if (missingPayload.length === 0) {
                window.showToast("🎉 太棒了，当前无缺失数据！");
            } else {
                renderMissingItemsList();
                document.getElementById('missing-data-modal').style.display = 'flex';
            }
        } else {
            window.showToast("⚠️ 后端扫描报错：" + res.message);
        }
    } catch(e) {
        // 🚨 防御塔3：前端执行异常时，控制台保留详细报错，页面用 Toast 提示
        console.error("💥 [DataCheck] 前端致命报错:", e);
        window.showToast("💥 扫描执行异常，请按 F12 查看控制台日志");
    } finally {
        // 恢复按钮状态
        btn.disabled = false;
        btn.innerHTML = originalHtml;
        if (typeof lucide !== 'undefined') lucide.createIcons();
    }
};

    function renderMissingItemsList() {
        const container = document.getElementById('missing-items-container');
        let html = '';

        missingPayload.forEach((item, index) => {
            html += `
            <label class="wa-group-header" style="justify-content: flex-start; padding: 10px 15px; margin: 0; border: 1px solid #f0f0f0;">
                <input type="checkbox" class="missing-chk-item" value="${index}" checked style="accent-color: var(--primary-color);">
                <span style="font-weight: 600; color: var(--text-main); flex: 1; margin-left: 5px;">${item.title}</span>
                <span class="wa-badge ${item.raw_type === 'Movie' ? 'movie' : 'tv'}">${item.type}</span>
                <span style="font-size: 12px; color: #ef4444; background: rgba(239,68,68,0.1); padding: 2px 8px; border-radius: 4px;">${item.reason}</span>
            </label>
            `;
        });

        container.innerHTML = html;
    }

    window.toggleAllMissingItems = function(isChecked) {
        document.querySelectorAll('.missing-chk-item').forEach(chk => {
            chk.checked = isChecked;
        });
    };

    window.executeDataPatch = async function() {
        const selectedIndexes = Array.from(document.querySelectorAll('.missing-chk-item:checked')).map(chk => parseInt(chk.value));
        if (selectedIndexes.length === 0) {
            window.showToast("必须勾选至少一项急救对象");
            return;
        }

        const taskPayload = selectedIndexes.map(idx => missingPayload[idx]);

        // 隐藏选框面板，复用现有的流式同步加载框作为状态展示容器
        document.getElementById('missing-data-modal').style.display = 'none';

        const overlay = document.getElementById('sync-modal-overlay');
        const modal = overlay.querySelector('.sync-modal-box');
        const subText = document.getElementById('sync-status-sub');

        overlay.style.display = 'flex'; void overlay.offsetWidth; overlay.style.opacity = '1'; modal.style.transform = 'scale(1)';
        subText.innerText = "正在唤醒 TMDB 元数据桥接引擎...";

        try {
            const response = await fetch('/api/execute_data_completion', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(taskPayload)
            });

            const reader = response.body.getReader();
            const decoder = new TextDecoder();
            let buffer = "";

            while (true) {
                const { value, done } = await reader.read();
                if (done) break;

                buffer += decoder.decode(value, { stream: true });
                let chunks = buffer.split('\n\n');
                buffer = chunks.pop();

                for (let chunk of chunks) {
                    if (chunk.startsWith("data: ")) {
                        const data = JSON.parse(chunk.substring(6));

                        if (data.status === 'syncing') {
                            subText.innerText = data.name;
                        } else if (data.status === 'done') {
                            subText.innerText = "全部修补序列执行完毕！正在重建缓存池...";
                            setTimeout(() => location.reload(), 1500);
                        } else if (data.status === 'error') {
                            subText.innerText = "补全任务发生阻断...";
                            window.showToast("执行出错，详情请查看后端日志。");
                        }
                    }
                }
            }
        } catch (error) {
            subText.innerText = "连接中断";
            window.showToast("执行异常阻断");
        }
    };
</script>
{% endblock %}
