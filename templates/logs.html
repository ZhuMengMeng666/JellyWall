{% extends 'base.html' %}

{% block content %}
<style>
    /* ==================================
       🌟 现代化结构日志控制台 UI
       ================================== */

    .modern-log-wrapper {
        background-color: var(--sidebar-bg, #ffffff);
        border-radius: 12px;
        border: 1px solid var(--border-color, #e2e8f0);
        box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        display: flex;
        flex-direction: column;
        height: calc(100vh - 120px);
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    /* ====== 顶部导航栏 ====== */
    .log-toolbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 12px 20px;
        border-bottom: 1px solid var(--border-color, #e2e8f0);
        background-color: var(--bg-color, #f8fafc);
        flex-wrap: wrap;
        gap: 15px;
    }

    /* 过滤选项卡 */
    .log-filters { display: flex; gap: 8px; }
    .filter-btn {
        background: transparent; border: none; padding: 6px 14px; border-radius: 6px;
        font-size: 13px; font-weight: 700; cursor: pointer; color: var(--text-muted, #64748b);
        transition: all 0.2s; letter-spacing: 0.5px;
    }
    .filter-btn.active[data-level="all"] { background: #f3e8ff; color: #7e22ce; }
    .filter-btn.active[data-level="info"] { background: #dcfce7; color: #16a34a; }
    .filter-btn.active[data-level="warning"] { background: #fef3c7; color: #d97706; }
    .filter-btn.active[data-level="error"] { background: #fee2e2; color: #dc2626; }
    .filter-btn:hover:not(.active) { background: rgba(128, 128, 128, 0.1); }

    /* 搜索框 */
    .log-search-box {
        display: flex; align-items: center; gap: 8px; background: transparent;
        padding: 4px 12px; border-radius: 6px; flex: 1; max-width: 250px;
    }
    .log-search-box input {
        border: none; background: transparent; outline: none;
        font-size: 13px; color: var(--text-main, #334155); width: 100%;
    }
    .log-search-box input::placeholder { color: var(--text-muted, #94a3b8); }

    /* ====== 右侧动作按钮区 (恢复原有功能) ====== */
    .log-actions { display: flex; gap: 10px; align-items: center; }
    .btn-terminal {
        background: transparent; color: var(--text-muted, #64748b);
        border: 1px solid var(--border-color, #e2e8f0); padding: 6px 12px;
        border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer;
        display: flex; align-items: center; gap: 6px; transition: all 0.2s;
    }
    .btn-terminal:hover { background: var(--bg-color, #f1f5f9); color: var(--text-main, #0f172a); }
    .btn-terminal.active { background: #dcfce7; color: #16a34a; border-color: #bbf7d0; }
    .btn-terminal.paused { background: #fef3c7; color: #d97706; border-color: #fde68a; }

    /* ====== 日志内容展示区 ====== */
    .log-viewer {
        flex: 1; padding: 20px; overflow-y: auto;
        font-family: 'Consolas', 'Courier New', monospace;
        background-color: var(--sidebar-bg, #ffffff);
    }
    .log-viewer::-webkit-scrollbar { width: 8px; }
    .log-viewer::-webkit-scrollbar-thumb { background: var(--border-color, #cbd5e1); border-radius: 4px; }

    /* ====== 🌟 单行日志排版 (截图复刻版) ====== */
    .log-row {
        display: flex; align-items: stretch; padding: 4px 0;
        font-size: 13px; line-height: 1.6; transition: background-color 0.2s;
    }
    .log-row:hover { background-color: var(--bg-color, rgba(0,0,0,0.02)); }

    /* 组内元素去除上下间距，使绿色线条无缝拼接 */
    .log-row.is-grouped { padding-top: 0; }
    .log-row.is-grouped .log-indicator::before { margin-top: 0 !important; border-top-left-radius: 0 !important; border-top-right-radius: 0 !important; }

    /* 1. 左侧时间列 (同秒内自动隐藏) */
    .log-time-col {
        width: 170px; color: #8b5cf6; font-weight: 700; flex-shrink: 0; padding-top: 1px;
    }
    .log-row.is-grouped .log-time-col { visibility: hidden; } /* 保留宽度，隐藏文字 */

    /* 2. 状态指示器 (绿线 或 黄圆点) */
    .log-indicator {
        width: 24px; display: flex; justify-content: center; flex-shrink: 0;
    }
    /* INFO 专属长条绿线 */
    .level-info .log-indicator::before {
        content: ''; width: 4px; background-color: #22c55e;
        border-radius: 2px; margin-top: 4px; margin-bottom: 2px;
    }
    /* WARNING & ERROR 专属警示圆点 */
    .level-warning .log-indicator::before,
    .level-error .log-indicator::before {
        content: ''; width: 8px; height: 8px; border-radius: 50%; margin-top: 8px;
    }
    .level-warning .log-indicator::before { background-color: #eab308; box-shadow: 0 0 4px rgba(234, 179, 8, 0.4); }
    .level-error .log-indicator::before { background-color: #ef4444; box-shadow: 0 0 4px rgba(239, 68, 68, 0.4); }

    /* 3. 级别徽章 (INFO: / WARNING:) */
    .log-badge { width: 75px; font-weight: 700; flex-shrink: 0; padding-top: 1px; margin-left: 8px; }
    .level-info .log-badge { color: #22c55e; }
    .level-warning .log-badge { color: #eab308; }
    .level-error .log-badge { color: #ef4444; }

    /* 4. 具体消息内容 */
    .log-msg { flex: 1; color: var(--text-main, #475569); padding-top: 1px; word-break: break-all; }
    .log-ms { color: var(--text-muted, #94a3b8); margin-right: 8px; }

    /* 系统日志隐藏控制 */
    .log-viewer.hide-sys-logs .log-row.log-sys-http { display: none !important; }
    .log-row.log-sys-http .log-msg { opacity: 0.6; }

    @media (max-width: 768px) {
        .log-toolbar { flex-direction: column; align-items: flex-start; }
        .log-actions { width: 100%; flex-wrap: wrap; justify-content: space-between; }
        .btn-terminal { flex: 1 1 calc(50% - 5px); justify-content: center; }
        #btn-autoscroll { flex: 1 1 100%; }
        .log-time-col { width: 80px; font-size: 11px; }
        .log-badge { width: 55px; font-size: 11px; }
    }
</style>

<div class="modern-log-wrapper">
    <!-- 顶部控制栏 -->
    <div class="log-toolbar">
        <div class="log-filters" id="filter-container">
            <button class="filter-btn active" data-level="all" onclick="setFilter('all')">全部</button>
            <!-- 移除 DEBUG，仅保留核心级别 -->
            <button class="filter-btn" data-level="info" onclick="setFilter('info')">INFO</button>
            <button class="filter-btn" data-level="warning" onclick="setFilter('warning')">WARNING</button>
            <button class="filter-btn" data-level="error" onclick="setFilter('error')">ERROR</button>
        </div>

        <div class="log-search-box">
            <i data-lucide="search" style="width: 14px; height: 14px; color: #94a3b8;"></i>
            <input type="text" id="log-search-input" placeholder="搜索日志内容..." oninput="doSearch(this.value)">
        </div>

        <div class="log-actions">
            <!-- 恢复原有的三大功能按钮 -->
            <button id="btn-syslogs" class="btn-terminal active" onclick="toggleSysLogs()">
                <i data-lucide="eye" style="width: 14px; height: 14px;"></i> 系统请求: 显示
            </button>
            <button id="btn-clear" class="btn-terminal" onclick="clearLogs()">
                <i data-lucide="trash-2" style="width: 14px; height: 14px;"></i> 清空面板
            </button>
            <button id="btn-autoscroll" class="btn-terminal active" onclick="toggleAutoScroll()">
                <i data-lucide="arrow-down-circle" style="width: 14px; height: 14px;"></i> 自动刷新: 开启
            </button>
        </div>
    </div>

    <!-- 核心渲染区 -->
    <div class="log-viewer" id="log-viewer">
        <!-- JS 动态注入行 -->
    </div>
</div>

<script>
    if (typeof lucide !== 'undefined') lucide.createIcons();

    const logViewer = document.getElementById('log-viewer');
    const btnAutoScroll = document.getElementById('btn-autoscroll');

    let isAutoScroll = true;
    let logStream = null;
    let currentFilter = 'all';
    let currentSearch = '';

    // 分组状态锚点
    let lastLogTimeSec = '';
    let lastLogLevel = '';

    // 恢复系统日志的本地存储记忆
    let showSysLogs = localStorage.getItem('jellywall_show_syslogs') !== 'false';

    // ==========================================
    // 🛠️ 原有功能逻辑恢复
    // ==========================================
    function updateSysLogsUI() {
        const btnSysLogs = document.getElementById('btn-syslogs');
        if (showSysLogs) {
            logViewer.classList.remove('hide-sys-logs');
            btnSysLogs.classList.add('active'); btnSysLogs.classList.remove('paused');
            btnSysLogs.innerHTML = `<i data-lucide="eye" style="width: 14px; height: 14px;"></i> 系统请求: 显示`;
        } else {
            logViewer.classList.add('hide-sys-logs');
            btnSysLogs.classList.remove('active'); btnSysLogs.classList.add('paused');
            btnSysLogs.innerHTML = `<i data-lucide="eye-off" style="width: 14px; height: 14px;"></i> 系统请求: 隐藏`;
        }
        if (typeof lucide !== 'undefined') lucide.createIcons();
        if (isAutoScroll) scrollToBottom();
    }

    function toggleSysLogs() {
        showSysLogs = !showSysLogs;
        localStorage.setItem('jellywall_show_syslogs', showSysLogs);
        updateSysLogsUI();
    }

    function clearLogs() {
        logViewer.innerHTML = '';
        lastLogTimeSec = '';
        lastLogLevel = '';
    }

    function toggleAutoScroll() {
        isAutoScroll = !isAutoScroll;
        if (isAutoScroll) {
            btnAutoScroll.classList.remove('paused'); btnAutoScroll.classList.add('active');
            btnAutoScroll.innerHTML = `<i data-lucide="arrow-down-circle" style="width: 14px; height: 14px;"></i> 自动刷新: 开启`;
            scrollToBottom();
        } else {
            btnAutoScroll.classList.remove('active'); btnAutoScroll.classList.add('paused');
            btnAutoScroll.innerHTML = `<i data-lucide="pause-circle" style="width: 14px; height: 14px;"></i> 自动刷新: 暂停`;
        }
        if (typeof lucide !== 'undefined') lucide.createIcons();
    }

    function scrollToBottom() { logViewer.scrollTop = logViewer.scrollHeight; }

    logViewer.addEventListener('scroll', () => {
        if (logViewer.scrollHeight - logViewer.scrollTop - logViewer.clientHeight > 50) {
            if (isAutoScroll) toggleAutoScroll();
        }
    });

    // ==========================================
    // 🛠️ 过滤器逻辑
    // ==========================================
    function setFilter(level) {
        currentFilter = level;
        document.querySelectorAll('.filter-btn').forEach(btn => {
            if (btn.dataset.level === level) btn.classList.add('active');
            else btn.classList.remove('active');
        });
        applyFilters();
    }

    function doSearch(val) {
        currentSearch = val.toLowerCase().trim();
        applyFilters();
    }

    function applyFilters() {
        const rows = document.querySelectorAll('.log-row');
        rows.forEach(row => {
            const matchLevel = (currentFilter === 'all' || row.dataset.level === currentFilter);
            const matchSearch = (!currentSearch || row.dataset.raw.includes(currentSearch));
            row.style.display = (matchLevel && matchSearch) ? 'flex' : 'none';
        });
        if (isAutoScroll) scrollToBottom();
    }

    // ==========================================
    // 🛠️ 强力解析引擎 (修复提取与分组逻辑)
    // ==========================================
    function parseRawLog(rawLog) {
        let result = { date: '', timeSec: '', level: 'INFO', msg: rawLog.trim(), rawLower: rawLog.toLowerCase(), isSys: false };
        if (result.rawLower.includes('[system-http]') || result.rawLower.includes('http/1.1"')) result.isSys = true;

        // 提取 Level
        const levelMatch = rawLog.match(/\[?(INFO|WARNING|WARN|ERROR)\]?/i);
        if (levelMatch) {
            let lvl = levelMatch[1].toUpperCase();
            if (lvl === 'WARN') lvl = 'WARNING';
            result.level = lvl;
            result.msg = result.msg.replace(levelMatch[0], '').trim();
        } else {
            if (result.rawLower.includes('error') || result.rawLower.includes('exception')) result.level = 'ERROR';
            else if (result.rawLower.includes('warn')) result.level = 'WARNING';
        }

        // 🌟 修复版正则：兼容无日期前缀的日志 (e.g., "15:44:50,467")，解决分组失败问题
        const timeMatch = result.msg.match(/(?:(\d{4}[-/]\d{2}[-/]\d{2})\s+)?(\d{2}:\d{2}:\d{2})[,.](\d{3})/);
        if (timeMatch) {
            // 如果后端带了日期，提取出来并从正文中干掉它，保持整洁
            if (timeMatch[1]) {
                result.date = timeMatch[1].replace(/-/g, '/');
                result.msg = result.msg.replace(timeMatch[1], '').trim();
            } else {
                // 如果后端没发日期，自动用浏览器今天的时间补齐左侧紫色的时间列
                const today = new Date();
                result.date = `${today.getFullYear()}/${String(today.getMonth() + 1).padStart(2, '0')}/${String(today.getDate()).padStart(2, '0')}`;
            }
            result.timeSec = timeMatch[2];
            // 注意：我们特意不把 "15:44:50,467" 从 msg 中删掉，为了完美复刻截图中消息自带时间的排版！
        } else {
            // 兜底方案
            const now = new Date();
            result.date = `${now.getFullYear()}/${String(now.getMonth() + 1).padStart(2, '0')}/${String(now.getDate()).padStart(2, '0')}`;
            result.timeSec = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}:${String(now.getSeconds()).padStart(2, '0')}`;
        }

        result.msg = result.msg.replace(/^[-:\s]+/, '').trim();
        return result;
    }

    // ==========================================
    // 🛠️ SSE 数据流与渲染
    // ==========================================
    function connectLogStream() {
        logStream = new EventSource('/api/log_stream');

        logStream.onmessage = function(event) {
            const rawLog = event.data;
            if (!rawLog.trim()) return;

            const logData = parseRawLog(rawLog);
            const currentSecStamp = `${logData.date} ${logData.timeSec}`;

            // 🌟 严格的分组判定：不仅要时间精准到同一秒，日志等级（INFO/WARNING）也要相同才进行折叠拼接！
            const isGrouped = (currentSecStamp === lastLogTimeSec) && (logData.level === lastLogLevel) && (currentSecStamp.trim() !== "");

            // 刷新锚点
            lastLogTimeSec = currentSecStamp;
            lastLogLevel = logData.level;

            const row = document.createElement('div');
            const levelClass = `level-${logData.level.toLowerCase()}`;
            row.className = `log-row ${levelClass} ${isGrouped ? 'is-grouped' : ''} ${logData.isSys ? 'log-sys-http' : ''}`;
            row.dataset.level = logData.level.toLowerCase();
            row.dataset.raw = logData.rawLower;

            row.innerHTML = `
                <div class="log-time-col">${currentSecStamp}</div>
                <div class="log-indicator"></div>
                <div class="log-badge">${logData.level}:</div>
                <div class="log-msg">${logData.msg}</div>
            `;

            logViewer.appendChild(row);

            if (logViewer.childElementCount > 1000) logViewer.removeChild(logViewer.firstElementChild);

            // 执行实时过滤
            const matchLevel = (currentFilter === 'all' || row.dataset.level === currentFilter);
            const matchSearch = (!currentSearch || row.dataset.raw.includes(currentSearch));
            row.style.display = (matchLevel && matchSearch) ? 'flex' : 'none';

            if (isAutoScroll) scrollToBottom();
        };

        logStream.onerror = function() {
            const errRow = document.createElement('div');
            errRow.className = 'log-row level-error';
            errRow.innerHTML = `
                <div class="log-time-col">System</div>
                <div class="log-indicator"></div><div class="log-badge">ERROR:</div>
                <div class="log-msg">日志流连接已断开，正在尝试重连...</div>
            `;
            logViewer.appendChild(errRow);
        };
    }

    document.addEventListener('DOMContentLoaded', () => {
        updateSysLogsUI();
        connectLogStream();
    });
</script>
{% endblock %}
